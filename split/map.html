<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TasteDraft · District map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="./map.css">
</head>
<body>
<div class="td-app">
  <header class="td-bar">
    <div class="td-brand">
      <i class="td-mark" aria-hidden="true"></i>
      <div>
        <h1 class="td-title">TasteDraft</h1>
        <p class="td-sub" id="td-sub">Japanese minimalist streetwear · 18–25</p>
      </div>
    </div>
    <label>City
      <select id="td-city" class="td-city" aria-label="Brief city"></select>
    </label>
  </header>
  <div class="td-layout">
    <div class="td-stage">
      <div id="td-map" class="td-map" role="application" aria-label="แผนที่ย่านแบบโต้ตอบ"></div>
    </div>
    <aside class="td-side">
      <p class="td-badge" id="td-badge">Loading</p>
      <p class="td-note" id="td-note">กำลังโหลดย่านจาก Qloo…</p>
      <div class="td-toggle" role="group" aria-label="Fits or friction">
        <button type="button" id="td-fits" data-district="fits" aria-pressed="true">Fits · เข้ากัน</button>
        <button type="button" id="td-friction" data-district="friction" aria-pressed="false">Friction · ขัด</button>
      </div>
      <div class="td-toggle" role="group" aria-label="Version">
        <button type="button" id="td-v1" data-version="v1" aria-pressed="false">V1</button>
        <button type="button" id="td-v2" data-version="v2" aria-pressed="false">V2</button>
        <button type="button" id="td-both" data-version="both" aria-pressed="true">V1 vs V2</button>
      </div>
      <ul class="td-legend" aria-label="Legend">
        <li><i style="background:#17182B"></i>V1</li>
        <li><i style="background:#0C5F38"></i>V2 fits</li>
        <li><i style="background:#A02B28"></i>Friction</li>
      </ul>
      <div id="td-cards" class="td-cards" aria-label="Location cards"></div>
      <div id="td-readout" class="td-readout"></div>
    </aside>
  </div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="./map.js"></script>
</body>
</html>
