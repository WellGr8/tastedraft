  <title>TasteDraft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading TasteDraft...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

{c.name}}\" selected=\"{{c.sel}}\">{{c.name}}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<svg class=\"byb-chev\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"byb-group\">\n<label for=\"interests\" class=\"byb-label\">ความสนใจของกลุ่มนี้ <span style=\"font-weight:400;letter-spacing:0;text-transform:none;color:#4A5273\">· ไม่บังคับ<\u002Fspan><\u002Flabel>\n<input id=\"interests\" class=\"byb-field byb-line\" type=\"text\" sc-camel-on-input=\"{{onInterests}}\" placeholder=\"คนกลุ่มนี้ใช้เวลาว่างไปกับอะไรบ้าง?\">\n<\u002Fdiv>\n<div class=\"byb-group\">\n<span class=\"byb-label\">Cultural references <span style=\"font-weight:400;letter-spacing:0;text-transform:none;color:#4A5273\">· 3–8 รายการ ไม่บังคับ<\u002Fspan><\u002Fspan>\n<p class=\"byb-help\">แบรนด์ ศิลปิน หนัง หรือสถานที่ที่ idea ของคุณอ้างอิงถึง<\u002Fp>\n<div class=\"byb-chips\">\n<sc-for list=\"{{refs}}\" as=\"r\" hint-placeholder-count=\"5\">\n<span class=\"byb-chip\">{{r.name}}<button type=\"button\" aria-label=\"ลบ {{r.name}}\" sc-camel-on-click=\"{{r.remove}}\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"byb-addrow\">\n<input class=\"byb-field byb-line\" type=\"text\" aria-label=\"เพิ่ม reference\" placeholder=\"มีแบรนด์ ศิลปิน หรือหนังที่ idea นี้ให้ความรู้สึกเหมือนไหม?\" sc-camel-on-input=\"{{onRefDraft}}\">\n<button type=\"button\" class=\"byb-addbtn\" sc-camel-on-click=\"{{addRef}}\">เพิ่ม<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<fieldset class=\"byb-group\">\n<legend class=\"byb-label\" style=\"margin-bottom:12px\">Positioning <span style=\"font-weight:400;letter-spacing:0;text-transform:none;color:#4A5273\">· ไม่บังคับ<\u002Fspan><\u002Flegend>\n<div class=\"byb-seg\">\n<sc-for list=\"{{poss}}\" as=\"p\" hint-placeholder-count=\"4\">\n<label><input type=\"radio\" name=\"pos\" checked=\"{{p.checked}}\" sc-camel-on-change=\"{{p.pick}}\"><span>{{p.label}}<\u002Fspan><\u002Flabel>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Ffieldset>\n<div class=\"byb-cta\" style=\"padding-top:6px\">\n<span class=\"byb-ring\"><button type=\"button\" class=\"byb-primary\" sc-camel-on-click=\"{{startTest}}\"><span>TEST CONCEPT<\u002Fspan><svg class=\"byb-arrow\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= PHASE 2 · QLOO ANALYSIS ================= -->\n<sc-if value=\"{{isAnalyze}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"byb-glass byb-an byb-rise\" role=\"status\" aria-live=\"polite\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<p class=\"byb-over\">Understanding your concept<\u002Fp>\n<h2 class=\"byb-h2\">{{anTitle}}<\u002Fh2>\n<\u002Fdiv>\n<ul class=\"byb-steps\">\n<sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"5\">\n<li class=\"{{s.cls}}\"><span class=\"byb-sd\"><sc-if value=\"{{s.done}}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><sc-if value=\"{{s.active}}\" hint-placeholder-val=\"{{ false }}\"><i><\u002Fi><\u002Fsc-if><\u002Fspan><span>{{s.text}}<\u002Fspan><\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<div class=\"byb-bar\" aria-hidden=\"true\"><i style=\"{{barStyle}}\"><\u002Fi><\u002Fdiv>\n<div class=\"byb-qtag\"><span class=\"byb-avatar\" style=\"width:24px;height:24px\" aria-hidden=\"true\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z\"><\u002Fpath><\u002Fsvg><\u002Fspan>Grounded by Qloo<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n\n<!-- ================= PHASE 3 · WORKSPACE ================= -->\n<sc-if value=\"{{isResult}}\" hint-placeholder-val=\"{{ false }}\">\n<sc-if value=\"{{busy}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"ws-busy\" role=\"status\" aria-live=\"polite\"><div class=\"chip\">{{busyText}}<span class=\"byb-dots\" aria-hidden=\"true\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n\n<div class=\"ws {{wsCls}}\">\n\n<!-- Concept header + taste playlist -->\n<header class=\"ws-head byb-rise\">\n<div class=\"ws-top\">\n<p class=\"byb-over\">Concept · {{verLabel}}<\u002Fp>\n<div class=\"ws-ver\" role=\"group\" aria-label=\"เวอร์ชัน\">\n<button type=\"button\" class=\"{{v1Cls}}\" sc-camel-on-click=\"{{setV1}}\">V1<\u002Fbutton>\n<button type=\"button\" class=\"{{v2Cls}}\" disabled=\"{{noV2}}\" sc-camel-on-click=\"{{setV2}}\">V2<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<h1 class=\"ws-title\">{{idea}}<\u002Fh1>\n<div class=\"ws-meta\">\n<button type=\"button\" class=\"byb-tbtn\" sc-camel-on-click=\"{{openBrief}}\">{{age}}<\u002Fbutton><span class=\"sep\">·<\u002Fspan>\n<button type=\"button\" class=\"byb-tbtn\" sc-camel-on-click=\"{{openBrief}}\">{{city}}<\u002Fbutton><span class=\"sep\">·<\u002Fspan>\n<button type=\"button\" class=\"byb-tbtn\" sc-camel-on-click=\"{{openBrief}}\">{{pos}}<\u002Fbutton>\n<button type=\"button\" class=\"byb-tbtn\" sc-camel-on-click=\"{{openBrief}}\" aria-label=\"แก้ concept\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h4L19 9l-4-4L4 16z\"><\u002Fpath><\u002Fsvg>แก้ไข<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"pl\" aria-label=\"Taste playlist\">\n<div class=\"pl-cards\">\n<sc-for list=\"{{plChips}}\" as=\"c\" hint-placeholder-count=\"5\"><figure class=\"{{c.cls}}\"><span class=\"{{c.shape}}\" style=\"{{c.coverStyle}}\"><b>{{c.initial}}<\u002Fb><sc-if value=\"{{c.hasImage}}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{c.image}}\" alt=\"\" loading=\"lazy\"><\u002Fsc-if><\u002Fspan><figcaption><span class=\"n\">{{c.name}}<\u002Fspan><span class=\"t\">{{c.type}}<\u002Fspan><\u002Ffigcaption><\u002Ffigure><\u002Fsc-for>\n<\u002Fdiv>\n<button type=\"button\" class=\"byb-tbtn\" sc-camel-on-click=\"{{openRefs}}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18V6l10-2v12\"><\u002Fpath><circle cx=\"6.5\" cy=\"18\" r=\"2.5\"><\u002Fcircle><circle cx=\"16.5\" cy=\"16\" r=\"2.5\"><\u002Fcircle><\u002Fsvg>จัดการ taste playlist<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{isV2}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"ws-changes\"><span class=\"byb-del\">premium pricing<\u002Fspan> <span class=\"byb-ins\">accessible premium<\u002Fspan> · <span class=\"byb-del\">limited-run exclusivity<\u002Fspan> <span class=\"byb-ins\">independent pre-order drops<\u002Fspan><\u002Fp><\u002Fsc-if>\n<\u002Fheader>\n\n<!-- The 10-second story -->\n<nav class=\"byb-rail\" aria-label=\"เส้นทางของผลลัพธ์\">\n<a class=\"byb-rn\" href=\"#sec-evidence\"><i><\u002Fi>Evidence<\u002Fa><span class=\"byb-rl\"><\u002Fspan>\n<a class=\"byb-rn\" href=\"#sec-score\"><i><\u002Fi>Resonance<\u002Fa><span class=\"byb-rl\"><\u002Fspan>\n<a class=\"byb-rn\" href=\"#sec-friction\"><i><\u002Fi>Friction<\u002Fa><span class=\"byb-rl\"><\u002Fspan>\n<a class=\"byb-rn\" href=\"#sec-agent\"><i><\u002Fi>Agent<\u002Fa><span class=\"byb-rl\"><\u002Fspan>\n<a class=\"byb-rn is-v2\" href=\"#sec-agent\"><i><\u002Fi>Version 2<\u002Fa>\n<\u002Fnav>\n\n<!-- 1 · Evidence, open by default -->\n<section class=\"ws-ev\" id=\"sec-evidence\" aria-label=\"Cultural evidence\">\n<div class=\"byb-who\"><span class=\"byb-avatar\" aria-hidden=\"true\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z\"><\u002Fpath><\u002Fsvg><\u002Fspan><p class=\"byb-over\">Cultural evidence · Grounded by Qloo<\u002Fp><\u002Fdiv>\n<p class=\"byb-prose\" style=\"font-size:19px\"><sc-for list=\"{{inference}}\" as=\"s\" hint-placeholder-count=\"6\"><span class=\"{{s.cls}}\" style=\"{{s.style}}\">{{s.text}}<\u002Fspan><\u002Fsc-for><\u002Fp>\n<div>\n<sc-for list=\"{{signals}}\" as=\"g\" hint-placeholder-count=\"4\">\n<button type=\"button\" class=\"ws-sr\" sc-camel-on-click=\"{{g.open}}\" aria-label=\"ดูหลักฐาน {{g.name}}\"><span class=\"byb-sdom\">{{g.domain}}<\u002Fspan><span class=\"byb-sname\">{{g.name}}<\u002Fspan><span class=\"byb-str\"><span class=\"{{g.pipsCls}}\"><i class=\"{{g.p1}}\"><\u002Fi><i class=\"{{g.p2}}\"><\u002Fi><i class=\"{{g.p3}}\"><\u002Fi><\u002Fspan>{{g.level}}<\u002Fspan><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button type=\"button\" class=\"byb-tbtn\" style=\"align-self:flex-start;margin-left:-12px\" aria-expanded=\"{{evOpen}}\" sc-camel-on-click=\"{{toggleEv}}\">{{mapBtn}}<\u002Fbutton>\n<sc-if value=\"{{evOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"byb-mapwrap\" style=\"border-top:0;padding-top:0\">\n<div class=\"byb-mapbox\"> iction -->\n<section class=\"ws-fc\" id=\"sec-friction\" aria-label=\"เข้ากันและขัด\">\n<div class=\"ws-col g\">\n<h3>What fits · เข้ากัน<\u002Fh3>\n<ul class=\"byb-list\">\n<sc-for list=\"{{fits}}\" as=\"f\" hint-placeholder-count=\"3\">\n<li class=\"byb-li\"><svg class=\"byb-ic\" style=\"color:#0C5F38\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"currentColor\" fill-opacity=\"0.14\" stroke=\"none\"><\u002Fcircle><path d=\"M7.5 12.5l3 3 6-6.5\"><\u002Fpath><\u002Fsvg><span>{{f.text}}<sc-if value=\"{{f.isNew}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"ws-new\">ใหม่<\u002Fspan><\u002Fsc-if><\u002Fspan><\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"ws-col r\">\n<h3>Cultural friction · ขัด<\u002Fh3>\n<div class=\"byb-list\">\n<sc-for list=\"{{frictions}}\" as=\"k\" hint-placeholder-count=\"2\">\n<div class=\"byb-why\">\n<button type=\"button\" class=\"byb-whyb\" aria-expanded=\"{{k.open}}\" sc-camel-on-click=\"{{k.toggle}}\">\n<span class=\"t\"><svg class=\"byb-ic\" style=\"color:#A02B28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"currentColor\" fill-opacity=\"0.14\" stroke=\"none\"><\u002Fcircle><path d=\"M8.5 8.5l7 7M15.5 8.5l-7 7\"><\u002Fpath><\u002Fsvg>{{k.text}}<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:10px\"><span class=\"byb-wtag\">WHY<\u002Fspan><svg class=\"{{k.chevCls}}\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{k.open}}\" hint-placeholder-val abel><\u002Fsc-for><\u002Fdiv><\u002Ffieldset>\n<\u002Fsc-if>\n\n<sc-if value=\"{{mRefs}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"pl-list\"><sc-for list=\"{{dRefs}}\" as=\"r\" hint-placeholder-count=\"5\"><div class=\"pl-row {{r.rowCls}}\"><span class=\"{{r.shape}} pl-cv\" style=\"{{r.coverStyle}}\"><b>{{r.initial}}<\u002Fb><sc-if value=\"{{r.hasImage}}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{r.image}}\" alt=\"\" loading=\"lazy\"><\u002Fsc-if><\u002Fspan><span class=\"pl-nm\">{{r.name}}<small>{{r.type}}<\u002Fsmall><\u002Fspan><button type=\"button\" class=\"byb-qk {{r.swCls}}\" role=\"switch\" aria-checked=\"{{r.on}}\" aria-label=\"ใช้ {{r.name}} เป็นหลักฐาน\" sc-camel-on-click=\"{{r.toggle}}\"><i><\u002Fi><\u002Fbutton><button type=\"button\" class=\"pl-rm\" aria-label=\"ลบ {{r.name}}\" sc-camel-on-click=\"{{r.remove}}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<div class=\"byb-addrow\"><input class=\"byb-field byb-line\" type=\"text\" aria-label=\"เพิ่ม reference\" placeholder=\"แบรนด์ ศิลปิน หนัง หรือสถานที่\" value=\"{{dRefDraft}}\" sc-camel-on-input=\"{{onDRefDraft}}\"><button type=\"button\" class=\"byb-addbtn\" sc-camel-on-click=\"{{addDRef}}\">เพิ่ม<\u002Fbutton><\u002Fdiv>\n<p class=\"byb-note\">{{dRefHint}}<\u002Fp>\n<\u002Fsc-if>\n\n<sc-if value=\"{{mProposal}}\" hint-placeholder-val=\"{{ false }}\">\n<div><sc-for list=\"{{props}}\" as=\"p\" hint-placeholder-count=\"2\">\n<div class=\"prop\"><div class=\"ba\"><span class=\"bf\">{{p.before}}<\u002Fspan><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4A5273\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><span class=\"af\">{{p.after}}<\u002Fspan><\u002Fdiv><p>{{p.why}}<\u002Fp><p class=\"ev\"><b>หลักฐาน<\u002Fb> · {{p.evidence}}<\u002Fp><\u002Fdiv>\n<\u002Fsc-for><\u002Fdiv>\n<p class=\"byb-note\">เมื่อ Apply แล้ว Agent จะแก้ concept และรันการประเมินเดิมซ้ำ เพื่อสร้าง Version 2 ส่วน V1 ยังอยู่ให้เทียบ<\u002Fp>\n<\u002Fsc-if>\n\n<sc-if value=\"{{mCompare}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"byb-cmp\">\n<div class=\"byb-cmr is-h\"><span><\u002Fspan><span style=\"text-align:right\">V1<\u002Fspan><span><\u002Fspan><span style=\"text-align:right\">V2<\u002Fspan><span style=\"text-align:right\">Δ<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{cmp}}\" as=\"r\" hint-placeholder-count=\"4\"><div class=\"byb-cmr\"><span>{{r.label}}<\u002Fspan><span class=\"n\">{{r.v1}}<\u002Fspan><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4A5273\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><span class=\"n\">{{r.v2}}<\u002Fspan><span class=\"d\">{{r.delta}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div><p class=\"byb-over\" style=\"margin-bottom:10px\">Why did it change?<\u002Fp><sc-for list=\"{{whyChanged}}\" as=\"w\" hint-placeholder-count=\"2\"><p class=\"byb-wi\" style=\"margin-bottom:10px\">{{w.text}}<\u002Fp><\u002Fsc-for><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{mEvidence}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"prop\" style=\"border-top:0;padding-top:0\"><div class=\"ba\"><span class=\"byb-sdom\">{{ev.domain}}<\u002Fspan><span style=\"font-weight:600\">{{ev.name}}<\u002Fspan><span class=\"byb-str\">{{ev.level}}<\u002Fspan><\u002Fdiv>\n<p>{{ev.meaning}}<\u002Fp>\n<p class=\"ev\"><b>ใช้คำนวณ<\u002Fb> · {{ev.feeds}}<\u002Fp>\n<p class=\"ev\"><b>มาจาก references<\u002Fb> · {{ev.refs}}<\u002Fp><\u002Fdiv>\n<p class=\"byb-note\">Signal นี้มาจาก Qloo cultural intelligence ส่วนคะแนนคำนวณโดยโมเดลของเรา<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<sc-if value=\"{{confirmDiscard}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"mdl-warn\" role=\"alert\"><span>ยังไม่ได้บันทึกการแก้ไข ต้องการทิ้งไหม<\u002Fspan><span><button type=\"button\" class=\"byb-quiet\" sc-camel-on-click=\"{{keepEditing}}\">กลับไปแก้<\u002Fbutton><button type=\"button\" class=\"byb-quiet\" sc-camel-on-click=\"{{discard}}\">ทิ้ง<\u002Fbutton><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n\n<div class=\"mdl-f\">\n<sc-if value=\"{{mHasQuiet}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" class=\"byb-quiet\" sc-camel-on-click=\"{{requestClose}}\">{{mQuiet}}<\u002Fbutton><\u002Fsc-if>\n<button type=\"button\" class=\"byb-solid\" sc-camel-on-click=\"{{mPrimary}}\" disabled=\"{{mDisabled}}\">{{mPrimaryLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"ws-toast\" role=\"status\" aria-live=\"polite\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg>{{toast}}<\u002Fdiv><\u002Fsc-if>\n\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;refImages&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;Comme des Gar\u00e7ons&quot;: &quot;https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Comme_des_Garcons_logo.svg/500px-Comme_des_Garcons_logo.svg.png&quot;, &quot;Muji&quot;: &quot;https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/MUJI_logo.svg/500px-MUJI_logo.svg.png&quot;, &quot;Aphex Twin&quot;: &quot;https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Aphex_Twin%2C_2008.jpg/500px-Aphex_Twin%2C_2008.jpg&quot;, &quot;Lost in Translation&quot;: &quot;https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/New_York_Bar_Unplugged%2C_Park_Hyatt_Tokyo_%288376387540%29.jpg/500px-New_York_Bar_Unplugged%2C_Park_Hyatt_Tokyo_%288376387540%29.jpg&quot;, &quot;Silver Lake&quot;: &quot;https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/Know_Your_City_No.101_Silver_Lake_Reservoir.jpg/500px-Know_Your_City_No.101_Silver_Lake_Reservoir.jpg&quot;}},&quot;phase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;input&quot;,&quot;analyzing&quot;,&quot;result&quot;],&quot;default&quot;:&quot;input&quot;,&quot;section&quot;:&quot;Flow&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nconst DEFAULT_IDEA = 'Japanese minimalist streetwear with an underground electronic identity, sold at a premium price in limited runs';\nconst AGES = ['18–25', '26–35', '36–45', '46+'];\nconst POS = ['Independent', 'Premium', 'Mass', 'Luxury'];\n// Illustrative city table: [minimal/independent districts, luxury districts]\nconst CITIES = {\n  'Los Angeles': [['Silver Lake', 'Echo Park'], ['Beverly Hills', 'West Hollywood']],\n  'New York': [['Lower East Side', 'Williamsburg'], ['Upper East Side', 'Tribeca']],\n  'San Francisco': [['Mission', 'Hayes Valley'], ['Pacific Heights', 'Union Square']],\n  'Austin': [['East Austin', 'South Congress'], ['Westlake', 'The Domain']],\n  'Miami': [['Wynwood', 'Little Haiti'], ['South Beach', 'Brickell']],\n  'Chicago': [['Logan Square', 'Wicker Park'], ['Gold Coast', 'River North']],\n  'Seattle': [['Capitol Hill', 'Fremont'], ['Medina', 'Bellevue']]\n};\n// Deterministic fit engine. Weights are config (the backend owns them); the LLM never sets a number.\nconst WEIGHTS = { anchor: 30, cross: 25, local: 20, audience: 25 };\nconst FRICTION_FACTOR = 0.4;\nconst SUBS1 = { anchor: 80, cross: 80, local: 74, audience: 68, friction: 12 };\nconst SUBS2 = { anchor: 80, cross: 80, local: 90, audience: 88, friction: 6 };\nconst STEPS = ['Structuring your audience', 'Resolving cultural references', 'Mapping location', 'Finding cross-domain cultural signals', 'Evaluating cultural friction'];\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      phase: props.phase || 'input', step: 0,\n      idea: DEFAULT_IDEA, ageIdx: 0, city: 'Los Angeles', interests: '', pos: 'Premium',\n      refs: ['Comme des Garçons', 'Muji', 'Aphex Twin', 'Lost in Translation', 'Silver Lake'], refDraft: '',\n      applied: false, ver: 1, busy: false, busyText: '', toast: '', muted: [], anim: null,\n      modal: null, draft: null, confirmDiscard: false, evSel: 0,\n      open: {}, evOpen: false, whyOpen: false, qFold: false, qOn: true\n    };\n    this.timers = [];\n    this.onKey = this.onKey.bind(this);\n  }\n  componentDidMount() {\n    try { document.addEventListener('keydown', this.onKey); } catch (e) { /* ignore */ }\n    if (this.state.phase === 'analyzing') this.runAnalysis();\n  }\n  componentDidUpdate(prev) {\n    if (prev.phase !== this.props.phase && this.props.phase && this.props.phase !== this.state.phase) {\n      this.clearTimers();\n      this.setState({ phase: this.props.phase, step: 0, applied: false, ver: 1, busy: false, modal: null }, () => { if (this.props.phase === 'analyzing') this.runAnalysis(); });\n    }\n  }\n  componentWillUnmount() {\n    this.clearTimers();\n    try { document.removeEventListener('keydown', this.onKey); } catch (e) { /* ignore */ }\n  }\n  clearTimers() { this.timers.forEach((t) => clearTimeout(t)); this.timers = []; }\n  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }\n  top() { try { window.scrollTo({ top: 0 }); } catch (e) { /* ignore */ } }\n  runAnalysis() {\n    STEPS.forEach((s, i) => this.later(() => this.setState({ step: i + 1 }), 900 * (i + 1)));\n    this.later(() => { this.top(); this.setState({ phase: 'result', step: 0, applied: false, ver: 1, open: {} }); }, 900 * STEPS.length + 700);\n  }\n  toastMsg(msg) { this.setState({ toast: msg }); this.later(() => this.setState({ toast: '' }), 3600); }\n\n  // ---- modal management: one focused task at a time, focus trapped and restored ----\n  openModal(name, draft) {\n    try { this.lastFocus = document.activeElement; } catch (e) { this.lastFocus = null; }\n    this.setState({ modal: name, draft: draft || null, confirmDiscard: false }, () => {\n      this.later(() => {\n        try {\n          const root = document.getElementById('mdl');\n          const first = root && root.querySelector('textarea, input[type=text], select, .byb-solid');\n          if (first) first.focus();\n        } catch (e) { /* ignore */ }\n      }, 60);\n    });\n  }\n  closeModal() {\n    this.setState({ modal: null, draft: null, confirmDiscard: false });\n    try { if (this.lastFocus && this.lastFocus.focus) this.lastFocus.focus(); } catch (e) { /* ignore */ }\n  }\n  isDirty() {\n    const s = this.state, d = s.draft;\n    if (!d) return false;\n    if (s.modal === 'brief') return d.idea !== s.idea || d.ageIdx !== s.ageIdx || d.city !== s.city || d.pos !== s.pos;\n    if (s.modal === 'refs') return JSON.stringify(d.refs) !== JSON.stringify(s.refs) || JSON.stringify(d.muted) !== JSON.stringify(s.muted);\n    return false;\n  }\n  requestClose() {\n    if (this.isDirty()) this.setState({ confirmDiscard: true });\n    else this.closeModal();\n  }\n  onKey(e) {\n    if (!this.state.modal) return;\n    if (e.key === 'Escape') { e.preventDefault(); this.requestClose(); return; }\n    if (e.key !== 'Tab') return;\n    try {\n      const root = document.getElementById('mdl');\n      if (!root) return;\n      const f = Array.prototype.slice.call(root.querySelectorAll('button:not([disabled]), input, select, textarea, [href]'));\n      if (!f.length) return;\n      const first = f[0], last = f[f.length - 1];\n      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }\n      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }\n    } catch (err) { /* ignore */ }\n  }\n  // Re-run the whole evaluation after the brief changed. Version 2 is invalidated because it was built on the old brief.\n  rerun(msg) {\n    this.setState({ busy: true, busyText: 'กำลังชนกับวัฒนธรรมใหม่', applied: false, ver: 1, open: {} });\n    this.later(() => { this.setState({ busy: false }); this.toastMsg(msg); }, 1700);\n  }\n  applyProposal() {\n    this.setState({ modal: null, draft: null, busy: true, busyText: 'กำลังจำลอง Version 2' });\n    try { if (this.lastFocus && this.lastFocus.focus) this.lastFocus.focus(); } catch (e) { /* ignore */ }\n    this.later(() => {\n      const a = this.compute(SUBS1).total, b = this.compute(SUBS2).total;\n      this.setState({ busy: false, applied: true, ver: 2, open: {}, anim: a });\n      this.toastMsg('Version 2 พร้อมแล้ว · resonance ' + a + ' → ' + b);\n      this.top();\n      // count up from V1 to V2 so the improvement is visible\n      for (let v = a + 1; v <= b; v++) this.later(() => this.setState({ anim: v }), 450 + (v - a) * 75);\n      this.later(() => this.setState({ anim: null }), 450 + (b - a + 1) * 75);\n    }, 2000);\n  }\n  saveDraft() {\n    const s = this.state, d = s.draft;\n    if (!d) return;\n    if (s.modal === 'brief') {\n      this.setState({ idea: d.idea.trim() || s.idea, ageIdx: d.ageIdx, city: d.city, pos: d.pos, modal: null, draft: null });\n    } else if (s.modal === 'refs') {\n      this.setState({ refs: d.refs, muted: d.muted, modal: null, draft: null });\n    }\n    try { if (this.lastFocus && this.lastFocus.focus) this.lastFocus.focus(); } catch (e) { /* ignore */ }\n    this.rerun('ประเมินใหม่แล้วตามที่แก้');\n  }\n\n  // ---- engine ----\n  compute(s) {\n    const p = {\n      anchor: Math.round(s.anchor * WEIGHTS.anchor / 100),\n      cross: Math.round(s.cross * WEIGHTS.cross / 100),\n      local: Math.round(s.local * WEIGHTS.local / 100),\n      audience: Math.round(s.audience * WEIGHTS.audience / 100),\n      friction: -Math.round(s.friction * FRICTION_FACTOR)\n    };\n    p.total = p.anchor + p.cross + p.local + p.audience + p.friction;\n    return p;\n  }\n  band(n) { return n >= 80 ? 'HIGH' : (n >= 60 ? 'MODERATE' : 'LOW'); }\n  fmt(n) { return n > 0 ? '+' + n : (n < 0 ? '−' + Math.abs(n) : '0'); }\n  segments(text, lex, counter) {\n    const lookup = {};\n    lex.forEach((x) => { lookup[x[0].toLowerCase()] = x[1]; });\n    const re = new RegExp('(' + lex.map((x) => x[0]).join('|') + ')', 'gi');\n    const out = [];\n    text.split(re).forEach((part, i) => {\n      if (part === '') return;\n      if (i % 2 === 0) { out.push({ text: part, cls: '', style: '' }); return; }\n      const cat = lookup[part.toLowerCase()];\n      if (cat === 'persona' || cat === 'place') { out.push({ text: part, cls: 'byb-' + cat, style: '' }); return; }\n      out.push({ text: part, cls: 'byb-hl byb-hl-' + cat, style: 'animation-delay:' + (300 + counter.n * 120) + 'ms' });\n      counter.n++;\n    });\n    return out;\n  }\n  hexes(c) {\n    const rows = [[1, 5], [0, 6], [0, 6], [1, 6], [2, 6], [3, 6], [4, 5]];\n    const w = 1 / 7.5, h = w * 1.1547, H = 5.5 * h;\n    const g = (cx, cy, k) => { const dx = cx - k.x, dy = (cy - k.y) * 0.866; return Math.exp(-(dx * dx + dy * dy) / (2 * k.s * k.s)); };\n    const out = []; let i = 0;\n    rows.forEach((range, r) => {\n      for (let col = range[0]; col <= range[1]; col++) {\n        const cx = col + (r % 2 ? 0.5 : 0);\n        const dm = g(cx, r, c.min), dl = g(cx, r, c.lux);\n        const gold = dl > dm && dl > 0.2;\n        const bg = gold ? 'rgba(184,137,43,' + (0.16 + 0.74 * dl).toFixed(2) + ')' : 'rgba(23,24,43,' + (0.07 + 0.8 * dm).toFixed(2) + ')';\n        out.push({ style: 'left:' + (cx * w * 100).toFixed(2) + '%;top:' + ((r * 0.75 / 5.5) * 100).toFixed(2) + '%;width:' + (w * 100).toFixed(2) + '%;height:' + ((h / H) * 100).toFixed(2) + '%;background:' + bg + ';animation-delay:' + (i * 12) + 'ms' });\n        i++;\n      }\n    });\n    return out;\n  }\n  pin(k, color) {\n    const w = 1 / 7.5;\n    return 'left:' + (k.x * w * 100 + w * 50).toFixed(2) + '%;top:' + ((k.y * 0.75 / 5.5) * 100 + (1 / 5.5) * 50).toFixed(2) + '%;--pin:' + color;\n  }\n  renderVals() {\n    const s = this.state;\n    const self = this;\n    const city = s.city;\n    const age = AGES[s.ageIdx];\n    const d = CITIES[city] || CITIES['Los Angeles'];\n    const distMin = d[0].join(' · ');\n    const distLux = d[1].join(' · ');\n    const active = s.refs.filter((r) => s.muted.indexOf(r) < 0);\n    const n = active.length;\n    // Sample resolved types for the demo references. Anything the user adds is a generic reference until Qloo resolves it.\n    const TYPES = { 'Comme des Garçons': 'Brand', 'Muji': 'Brand', 'Aphex Twin': 'Artist', 'Lost in Translation': 'Film', 'Silver Lake': 'Place' };\n    const imgs = (self.props && self.props.refImages) || {};\n    const cover = (r) => { const type = TYPES[r] || 'Reference'; return { type: type, shape: 'cv ' + (type === 'Artist' ? 'rd' : 'sq'), image: imgs[r] || '', hasImage: !!imgs[r] }; };\n    const hue = (str) => { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360; return 'background:linear-gradient(135deg,hsl(' + h + ',34%,40%),hsl(' + ((h + 48) % 360) + ',38%,56%))'; };\n    const evKey = n >= 4 ? 'HIGH' : (n >= 2 ? 'MEDIUM' : 'LIMITED');\n    const limited = evKey === 'LIMITED';\n    const sigCount = 2 * n + 1;\n    const domCount = n >= 4 ? 4 : (n >= 2 ? 3 : 2);\n    const p1 = this.compute(SUBS1), p2 = this.compute(SUBS2);\n    const isV2 = s.applied && s.ver === 2;\n    const cur = isV2 ? p2 : p1;\n    const b = this.band(cur.total);\n    const liveTotal = (s.anim !== null && isV2) ? s.anim : cur.total;\n    const shown = limited ? '≈ ' + (Math.round(cur.total / 5) * 5) : String(liveTotal);\n    const pn = (v) => (v === 'HIGH' ? 'สูง' : (v === 'MODERATE' ? 'ปานกลาง' : 'ต่ำ'));\n    const set = (o) => () => self.setState(o);\n\n    // inference text (places come from the selected city so nothing mixes)\n    const lex = [\n      ['culturally curious urban explorers', 'persona'], ['streetwear', 'fashion'], ['minimalism', 'fashion'], ['design', 'fashion'],\n      ['electronic', 'music'], ['alternative', 'music'], ['authentic', 'value']\n    ].concat(d[0].map((x) => [x, 'place'])).concat(d[1].map((x) => [x, 'place']));\n    const counter = { n: 0 };\n    const inference = this.segments('คนวัย ' + age + ' ใน ' + city + ' ที่ตอบรับแนวนี้ส่วนใหญ่คือ culturally curious urban explorers ที่ชอบ streetwear, minimalism และ design ที่จริงจัง เขาให้ค่ากับความ authentic มากกว่าความหรูหรา และมักฟัง electronic / alternative music', lex, counter);\n    const mapCap = this.segments('สัญญาณแนว independent / minimal หนาที่สุดใน ' + d[0][0] + ' และ ' + d[0][1] + ' ขณะที่ความหรูหรากระจุกอยู่ที่ ' + d[1][0] + ' และ ' + d[1][1], lex, counter);\n\n    // evidence rows (tap to inspect)\n    const names = ['', 'Limited', 'Moderate', 'Strong'];\n    const sigDef = [\n      ['Fashion', 'Japanese minimalism', 3, 'Cross-domain fit'],\n      ['Music', 'Electronic / alternative', 3, 'Cross-domain fit'],\n      ['Design', 'Independent aesthetic', 3, 'Anchor affinity'],\n      ['Location', distMin, isV2 ? 3 : 2, 'Local fit']\n    ];\n    const refsText = n ? active.join(', ') : 'ยังไม่ได้ระบุ references';\n    const signals = sigDef.map((x, i) => {\n      const L = Math.max(1, x[2] - (limited ? 1 : 0));\n      return { domain: x[0], name: x[1], level: names[L], pipsCls: L === 2 ? 'byb-pips is-mod' : 'byb-pips', p1: 'on', p2: L >= 2 ? 'on' : '', p3: L >= 3 ? 'on' : '', open: () => self.openModal('evidence', null) || self.setState({ evSel: i }) };\n    });\n    const sel = signals[Math.min(s.evSel, 3)];\n    const selDef = sigDef[Math.min(s.evSel, 3)];\n    const ev = {\n      domain: sel.domain, name: sel.name, level: sel.level,\n      meaning: sel.name + ' อยู่ในระดับ ' + sel.level + ' สำหรับคนวัย ' + age + ' ใน ' + city,\n      feeds: selDef[3]
